# Example only. Copy to a path outside the repo (for example ~/pingpong.local.yaml)
# and point PINGPONG_CONFIG or --config at it. Do not commit real addresses.

router:
  listen: "127.0.0.1:8787"
  allowed_hosts:
    - "mane.<your-tailnet>.ts.net"
    - "localhost"
    - "127.0.0.1"
  max_body_bytes: 4194304
  log_level: info

machines:
  - name: mane
    address: "http://127.0.0.1:11434"
    roles: [fast]
    default_model: "llama3.1:8b"
    max_concurrent: 1
    num_ctx: 8192

  - name: firmino
    # Use Firmino's Tailscale address if the machines are on different subnets.
    address: "http://FIRMINO_TAILSCALE_ADDRESS:11434"
    # Optional. Hardware card for a machine that is not this host.
    # Run `pingpong hoststats` on that machine, bound to its Tailscale address.
    stats_address: "http://FIRMINO_TAILSCALE_ADDRESS:8788"
    roles: [heavy]
    default_model: "qwen3:30b-a3b-instruct-2507-q4_K_M"
    max_concurrent: 1
    num_ctx: 8192

routing:
  auto_role: heavy
  fast_role: fast

# V5 named presets. Defaults if omitted: fast (fast flag), balanced (auto), deep (auto).
# Set deep.model when a larger model is installed.
# profiles:
#   fast:
#     fast: true
#   balanced: {}
#   deep:
#     model: "qwen3:30b-a3b-instruct-2507-q4_K_M"

timeouts:
  connect_timeout: 5s
  first_token_timeout: 30m
  idle_token_timeout: 5m
  max_run_time: 2h
  heartbeat_interval: 15s

health:
  interval: 30s
  timeout: 10s
  failures_to_mark_down: 2
  registry_refresh_interval: 5m
  refresh_on_model_miss: true

# V6: optional shutdown grace (default 10s when omitted)
# router:
#   shutdown_grace: 10s

# V7: short names for models (optional)
# aliases:
#   code:
#     model: qwen2.5-coder:14b
#   quick:
#     model: llama3.2:3b
#     machine: mane

# V2: durable jobs (SQLite). Uncomment to enable /api/jobs and background retries.
# storage:
#   data_dir: "~/Library/Application Support/pingpong"
# retry:
#   retry_interval: 2m
#   retry_window: 3h
# retention_days and sweep intervals use defaults when omitted (see docs/CONFIGURATION.md).

# V7.1 batch limits (optional). Default max_items is 500 (D-118); set 1000 only after RSS check on Mane.
# batches:
#   max_items: 500

# V7.6 file upload (optional). Defaults: max_bytes 2097152, chunk_chars 6000.
# files:
#   max_bytes: 2097152
#   chunk_chars: 6000

# V7.3 prompt templates (optional). Defaults: max_bytes 16384, max_count 200.

# V7.7 scheduled jobs (optional). Defaults: max_count 50, grace 1h.
# schedules:
#   max_count: 50
#   grace: 1h

# V7.5 conversation threads (optional). Default max_turns is 200.
# threads:
#   max_turns: 200
# templates:
#   max_bytes: 16384
#   max_count: 200

# V7.8 OpenAI-compatible /v1 API (optional). Default is off.
# openai:
#   enabled: true

# V7.9 outbound notifications (optional). Default is off. Put a real URL only in the local config file.
# notify:
#   webhook_url: ""
#   events: [batch_done, schedule_failed, job_failed]
#   timeout: 10s