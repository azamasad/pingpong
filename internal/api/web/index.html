<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pingpong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pingpong</h1>
    <nav class="tabs">
      <button type="button" id="tab-chat" class="active">Chat</button>
      <button type="button" id="tab-status">Status</button>
    </nav>
    <p id="machines" class="machines">Loading machines…</p>
  </header>
  <main id="panel-chat">
    <div class="controls">
      <label>Profile <select id="profile"><option value="">—</option></select></label>
      <label><input type="checkbox" id="fast"> Fast (Mane)</label>
      <label id="lane-wrap" class="hidden"><input type="checkbox" id="batch-lane"> Batch lane</label>
      <label>Model <select id="model"><option value="">—</option></select></label>
      <label>Machine <select id="machine"><option value="">—</option></select></label>
    </div>
  <textarea id="prompt" rows="5" placeholder="Message…"></textarea>
  <div class="actions">
    <button id="send">Send</button>
    <button id="stop" disabled>Stop</button>
    <span id="state"></span>
    <span id="elapsed"></span>
  </div>
  <p id="provenance"></p>
  <div id="thinking" class="collapsed"></div>
  <pre id="out"></pre>
  <p id="warn" class="warn hidden"></p>
  <p id="err" class="err hidden"></p>
  <aside id="jobs-panel" class="jobs hidden">
    <div class="jobs-header">
      <h2>Request history</h2>
      <label>Status
        <select id="jobs-filter">
          <option value="">All</option>
          <option value="waiting">waiting</option>
          <option value="running">running</option>
          <option value="retrying">retrying</option>
          <option value="done">done</option>
          <option value="failed">failed</option>
          <option value="cancelled">cancelled</option>
        </select>
      </label>
    </div>
    <ul id="jobs-list"></ul>
    <div id="job-detail" class="job-detail hidden">
      <p id="job-meta" class="job-meta"></p>
      <div class="job-actions">
        <button type="button" id="job-reattach">Watch / reattach</button>
        <button type="button" id="job-cancel">Cancel</button>
        <button type="button" id="job-delete">Delete</button>
      </div>
      <pre id="job-out"></pre>
      <ul id="job-history" class="job-history"></ul>
    </div>
  </aside>
  </main>
  <section id="panel-status" class="hidden">
    <pre id="status-out">Loading status…</pre>
  </section>
  <script src="app.js"></script>
</body>
</html>
